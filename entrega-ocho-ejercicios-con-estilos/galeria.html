<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<title>Galería de Algeciras</title>
<style>
  body{font-family:system-ui;margin:1rem}
  .grid{
    display:grid;
    gap:1rem;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  }
  figure{margin:0;border:1px solid #ddd;padding:.5rem;border-radius:4px}
  figcaption{text-align:center;margin-top:.4rem;font-size:.9rem;color:#555}
</style>
</head>
<body>
  <h1>Galería de Algeciras</h1>
  <section class="grid">
    <!-- Sustituye las imágenes provisionales por fotografías reales de los lugares. -->
    <figure>
      <img src="https://dynamic-media-cdn.tripadvisor.com/media/photo-o/0a/e8/b5/29/plaza-alta.jpg?w=1200&h=-1&s=1" alt="Imagen provisional de la Plaza Alta" width="100%" />
      <figcaption>Plaza Alta</figcaption>
    </figure>
    <figure>
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQlDXxbMoePMlp385OMQzYa_q1zBWobAg0BAB14MOAxuFsn4RBiv7pGhpOp&s=10" alt="Imagen del barrio de San Isidro" width="100%" />
      <figcaption>Barrio de San Isidro</figcaption>
    </figure>
    <figure>
      <img src="https://static.grupojoly.com/clip/fd3b27ed-5975-4dd4-97f4-3ef356b5293b_source-aspect-ratio_1600w_0.jpg" alt="Imagen de la iglesia de Nuestra Señora de la Palma" width="100%" />
      <figcaption>Iglesia de Nuestra Señora de la Palma</figcaption>
    </figure>
    <figure>
      <img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/4/48/Capilla_de_Europa_Algeciras_2019.jpg/960px-Capilla_de_Europa_Algeciras_2019.jpg" alt="Imagen de la capilla de Nuestra Señora de Europa" width="100%" />
      <figcaption>Capilla de Nuestra Señora de Europa</figcaption>
    </figure>
    <figure>
      <img src="https://upload.wikimedia.org/wikipedia/commons/8/88/Rinconcillo_2.JPG" alt="Imagen de la playa del Rinconcillo" width="100%" />
      <figcaption>Playa del Rinconcillo</figcaption>
    </figure>
    <figure>
      <img src="https://www.monplamar.com/wp-content/uploads/2017/07/Monplamar-Algeciras-playa-de-Getares.jpg" alt="Imagen de la playa de Getares" width="100%" />
      <figcaption>Playa de Getares</figcaption>
    </figure>
  </section>
</body>
</html>
