
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Segunda página</title>
    <style>
        body { font-family: Arial; background: #eee; margin: 30px; }
        header, footer { background: #222; color: white; padding: 20px; }
        main { background: white; padding: 20px; }
        nav, section { margin: 20px 0; }
        a { color: blue; }
    </style>
</head>
<body>
    <header>
        <h1>Segunda página: contenido incrustado</h1>
    </header>

    <nav>
        <a href="index.html">Volver al inicio</a>
    </nav>

    <main>
        <section>
            <h2>Etiqueta embed</h2>
            <embed src="contenido.swf" width="300" height="200">
        </section>

        <section>
            <h2>Etiqueta object</h2>
            <object data="contenido.swf" type="application/x-shockwave-flash" width="300" height="200">
                Contenido multimedia no compatible.
            </object>
        </section>

        <section>
            <h2>Etiqueta canvas</h2>
            <canvas id="miCanvas" width="200" height="200">
                Tu navegador no admite canvas.
            </canvas>
            <script>
                miCanvas.getContext("2d").fillRect(25,25,150,100)
            </script>
        </section>

        <section>
            <h2>Etiqueta SVG</h2>
            <svg width="400" height="180">
                <rect x="50" y="20" width="300" height="100" style="fill:blue" />
            </svg>
        </section>
    </main>

    <footer>
        <p>Trabajo de HTML - Segunda página</p>
    </footer>
</body>
</html>
