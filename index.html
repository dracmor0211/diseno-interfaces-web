
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Incrustación de contenido</title>
    <style>
        body { font-family: Arial; background: #eee; margin: 30px; }
        header, footer { background: #222; color: white; padding: 20px; }
        main { background: white; padding: 20px; }
        nav, section { margin: 20px 0; }
        a { color: blue; }
    </style>
</head>
<body>
    <header>
        <h1>Ejemplo de Incrustación de Contenido</h1>
    </header>

    <nav>
        <a href="index.html">Inicio</a> |
        <a href="dos.html">Segunda página</a>
    </nav>

    <main>
        <section>
            <h2>Imagen de Algeciras</h2>
            <img src="https://www.comprarbanderas.es/images/banderas/400/5609-algeciras-ce_400px.jpg" alt="Bandera de Algeciras" width="300">
        </section>

        <section>
            <h2>Vídeo</h2>
            <video src="video.mp4" controls width="400"></video>
        </section>

        <section>
            <h2>Audio</h2>
            <audio src="audio.mp3" controls></audio>
        </section>

        <section>
            <h2>Vídeo de YouTube</h2>
            <iframe width="560" height="315" src="https://www.youtube.com/embed/o1wIW5nr5LM?si=MVmKd0w657puUWbB" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </section>
    </main>

    <footer>
        <p>Trabajo de HTML - Contenido incrustado</p>
    </footer>
</body>
</html>
